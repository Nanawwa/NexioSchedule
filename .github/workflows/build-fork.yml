name: Build fork APKs

# 只在 fork 自己的分支上跑；上游 master 的推送不触发。
on:
  push:
    branches:
      - 'fork/**'
    tags:
      - 'v*-fork.*'
  workflow_dispatch:
    inputs:
      app_id:
        description: 'applicationId（留空用默认共存包名）'
        required: false
        default: 'com.haooz.chedule.fork'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve app id
        id: appid
        run: |
          APP_ID="${{ github.event.inputs.app_id }}"
          if [ -z "$APP_ID" ]; then APP_ID="com.haooz.chedule.fork"; fi
          echo "value=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "building $APP_ID"

      # 手机端与手表端必须同包名，Data Layer 才能配对。
      # 用 debug 变体：无需配置签名，侧载即可安装。
      - name: Build phone APK
        run: |
          ./gradlew :androidApp:assembleDebug \
            -PnexioAppId=${{ steps.appid.outputs.value }} \
            --no-daemon --stacktrace

      - name: Build wear APK
        run: |
          ./gradlew :wearApp:assembleDebug \
            -PnexioAppId=${{ steps.appid.outputs.value }} \
            --no-daemon --stacktrace

      - name: Run core tests
        run: ./gradlew :core:jvmTest checkKmpPurity --no-daemon

      - name: Rename artifacts
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          mkdir -p out
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk \
             "out/nexio-phone-$SHORT_SHA.apk"
          cp wearApp/build/outputs/apk/debug/wearApp-debug.apk \
             "out/nexio-wear-$SHORT_SHA.apk"
          ls -la out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nexio-fork-apk-${{ github.sha }}
          path: out/*.apk
          retention-days: 30

      # 打 tag（如 v1.6.5-fork.1）时自动建 Release，平时只留 artifact
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
